# Weekly update pull requests, on the Monday before the Security run.
# Minor and patch updates are grouped per ecosystem; each major update gets
# its own pull request. Version updates wait 7 days after a release, so a
# compromised release is more likely to be caught upstream first; security
# updates do not wait.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
